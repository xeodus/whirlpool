[package]
name = "o7-harness"
version = "0.1.0"
edition = "2021"

# Versions pinned to LiteSVM 0.17.0's resolved dependency tree. A verifier built
# with platform-tools v1.57 (SBPFv3) must be measured with a Solana 4.x runtime;
# LiteSVM 0.6.1 (Solana 2.2) rejects it with InvalidAccountData.
[dependencies]
litesvm = "=0.17.0"
solana-address = "=2.7.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
solana-compute-budget-interface = "3"
