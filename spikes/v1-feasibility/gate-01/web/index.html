<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Whirlpool proof interoperability test</title>
  </head>
  <body>
    <h1>Browser proof interoperability test</h1>
    <p>Research circuit only. The test setup is insecure and proves no Whirlpool balance or ownership.</p>
    <button id="prove">Prove that private test number 7 squares to 49</button>
    <pre id="status" aria-live="polite">Ready</pre>
    <script src="/snarkjs.min.js"></script>
    <script>
      const status = document.getElementById('status');
      document.getElementById('prove').addEventListener('click', async () => {
        try {
          status.textContent = 'Generating witness and proof locally…';
          const start = performance.now();
          const { proof, publicSignals } = await snarkjs.groth16.fullProve(
            { secret: '7' }, '/square.wasm', '/square_final.zkey');
          const elapsedMs = Math.round(performance.now() - start);
          const vk = await (await fetch('/verification_key.json')).json();
          if (!await snarkjs.groth16.verify(vk, publicSignals, proof)) {
            throw new Error('Local proof verification failed');
          }
          const response = await fetch('/fixture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proof, publicSignals }),
          });
          if (!response.ok) throw new Error('Could not save local fixture');
          status.textContent = `Verified locally in ${elapsedMs} ms. Public square: ${publicSignals[0]}. Saved browser-proof.json.`;
        } catch (error) {
          status.textContent = `Failed: ${error.message}`;
        }
      });
      if (new URLSearchParams(location.search).has('autorun')) {
        document.getElementById('prove').click();
      }
    </script>
  </body>
</html>
