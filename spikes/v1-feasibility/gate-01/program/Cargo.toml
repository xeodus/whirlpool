[package]
name = "whirlpool-gate-01-verifier"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
custom-heap = []
custom-panic = []

[dependencies]
groth16-solana = "=0.2.0"
